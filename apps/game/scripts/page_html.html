"45847623\":false,\"45781675\":true,\"45745682\":true,\"45803631\":true,\"45861221\":false,\"45675121\":false,\"45759339\":true,\"45718928\":false,\"45618044\":true,\"45634549\":true,\"45718749\":100,\"45792003\":false,\"45759311\":true,\"45811886\":true,\"45816147\":true,\"45762744\":false,\"45532085\":true,\"45840163\":false,\"45726287\":false,\"45804111\":false,\"45752281\":false,\"45729160\":true,\"45742601\":false,\"45747613\":\"2025-04-01\",\"45836710\":14,\"45726291\":true,\"45783831\":true,\"45770350\":20,\"45767936\":false,\"45690947\":50,\"45726731\":true,\"45670035\":true,\"45856531\":false,\"45692510\":false,\"45845469\":true,\"45828864\":false,\"45681005\":50,\"45642397\":false,\"45702980\":true,\"45689609\":\"[]\",\"45797901\":false,\"45857980\":false,\"45728197\":true,\"45813205\":false,\"45731385\":false,\"45724929\":true,\"45836246\":\"\",\"45811348\":true,\"45857988\":false,\"45828384\":false,\"45860451\":false,\"45747329\":false,\"45632647\":true,\"45716789\":true,\"45748667\":\"[[\\\"5bf011840784117a\\\",\\\"e051ce1aa80aa576\\\",\\\"b11155c88d2cdac8\\\"]]\",\"45758969\":true,\"45835457\":false,\"45747802\":true,\"45743311\":true,\"45727588\":\"[]\",\"45818004\":false,\"45698757\":true,\"45532353\":true,\"45820651\":\"[[\\\"monday-connector-prod\\\",\\\"4295235d-8c9d-42de-9add-d125d54d7491-mcp-evernote-com\\\",\\\"f5e83368-0659-407a-98a6-2100a0586080-mcp-pandadoc-com\\\",\\\"shopify-connector-prod\\\"]]\",\"45428801\":\"A\",\"45630970\":true,\"45654883\":false,\"45655382\":true,\"45678004\":false,\"45870593\":false,\"45807846\":true,\"45764975\":false,\"45707257\":false,\"45773788\":true,\"45869560\":false,\"45428812\":false,\"45681648\":false,\"45630517\":true,\"45864611\":false,\"45840780\":false,\"45768409\":false,\"45690847\":\"\",\"45727701\":true,\"45680680\":true,\"45642259\":false,\"45764650\":false,\"45823762\":false,\"45649882\":true,\"45755013\":true,\"45768315\":false,\"45865879\":false,\"45862080\":false,\"45700634\":270,\"45707063\":true,\"45733280\":false,\"45676455\":true,\"45855603\":true,\"45735500\":true,\"45752369\":true,\"45837313\":false,\"45708712\":false,\"45845259\":true,\"45849940\":false,\"45719771\":false,\"45719064\":false,\"45428988\":30000,\"45812723\":true,\"45864641\":false,\"45716325\":true,\"45756588\":2147483648,\"45676406\":\"comment-tag\",\"45813600\":true,\"45696889\":true,\"45807551\":\"# Goal:\\nGenerate a personalized, styled topic response based on a user\u0027s recurring interests. Based on the raw data provided at the bottom, you would generate a response following the rules below. Only ground the response on the data provided in the context. Do not search online or add additional information.\\n\\n### Step 1: Format the Main User-Facing Response\\n1.  **Identify the latest state of the Topic:** Look through the topic context to identify its latest state, including the user\u0027s overarching goal, key decisions, key things that have happened, where the user is in their journey, what are potential next steps users might want to take. Make use of this information to generate the follow components together (bullet 2-4 below)\\n2.  **Greeting**: Based on bullet 1 above, start with a 1-sentence brief greeting or question from Gemini using the # header to invite the user to engage with this topic. Pick the greeting style that best fits the current moment from the options below.\\n\\n      **Critical: Vary your phrasing.** Do not start greetings the same way repeatedly. Mix up your sentence structure — use questions, statements, exclamations, or fragments. Avoid defaulting to the same opening words.\\n\\n      Do NOT overuse these starter patterns:\\n        × \\\"Ready to...\\\"\\n        × \\\"Let\u0027s...\\\"\\n        × \\\"Time to...\\\"\\n        × \\\"Looking to...\\\"\\n        × \\\"Want to...\\\"\\n        × \\\"How about...\\\"\\n\\n      **Greeting granularity:** Keep greetings at the right level of abstraction. Reference the topic\u0027s emotional core or current momentum — not hyper-specific details like part numbers, exact dates, or item specs. Save those for the Latest State Summary.\\n\\n      Greeting styles and example phrasings (use these as inspiration, not templates):\\n\\n        a) **Thoughtful check-in** — when the journey is ongoing without a major recent event:\\n           - \\\"How\u0027s [topic] coming along?\\\"\\n           - \\\"Checking in — any updates on [topic]?\\\"\\n           - \\\"What\u0027s the latest with [topic]?\\\"\\n           - \\\"Still feeling good about [direction/decision]?\\\"\\n           - \\\"[Topic] has been on your mind — where do things stand?\\\"\\n\\n        b) **Progress celebration** — when the user hit a milestone, made a decision, or completed a step:\\n           - \\\"That\u0027s a big one — [milestone] is done!\\\"\\n           - \\\"Look at that, [achievement]!\\\"\\n           - \\\"[Decision] was a solid call.\\\"\\n           - \\\"You\u0027ve been putting in the work on [topic] — it shows.\\\"\\n           - \\\"Major progress — [thing] is officially behind you.\\\"\\n\\n        c) **Reflection prompt** — when the user has been on a longer journey and it\u0027s a good moment to step back:\\n           - \\\"It\u0027s been a few weeks with [topic] — how\u0027s it feeling?\\\"\\n           - \\\"A lot has happened with [topic] — worth a quick look back?\\\"\\n           - \\\"You\u0027ve come a long way on this one.\\\"\\n           - \\\"Funny how much [topic] has evolved since you started.\\\"\\n\\n        d) **Callback to a specific detail** — when the context has a memorable, personal detail worth referencing:\\n           - \\\"Curious how [detail from context] played out.\\\"\\n           - \\\"You were weighing [option A vs B] — any verdict?\\\"\\n           - \\\"That [memorable moment] must have been something.\\\"\\n\\n           Avoid framing callbacks as yes/no questions (e.g., \\\"Did X happen?\\\"). Instead, use open-ended references that invite the user to share, not just confirm.\\n\\n           This style works best when the detail is central to the topic or represents a key decision point. Don\u0027t use it to surface a random anecdote from a broad, ongoing topic. Also avoid referencing negative incidents or naming other people (partners, family) in the greeting.\\n\\n        e) **Invitation to continue** — when there\u0027s clear unfinished work from a previous session:\\n           - \\\"You left off right at [specific point] — pick it up?\\\"\\n           - \\\"[Unfinished step] is here whenever you\u0027re ready.\\\"\\n           - \\\"There\u0027s a fun decision still waiting on [topic].\\\"\\n           - \\\"Picking up from last time — [context].\\\"\\n\\n           Frame unfinished work as an opportunity, not a backlog. The tone should feel like \\\"here\u0027s something interesting to come back to\\\" — not a task reminder.\\n\\n        f) **Anticipation builder** — when something exciting or important is coming up:\\n           - \\\"[Event] is right around the corner!\\\"\\n           - \\\"Only [X days] until [event] — exciting stuff.\\\"\\n           - \\\"The countdown is on for [event].\\\"\\n           - \\\"[Event] is getting close — feeling prepared?\\\"\\n           - \\\"Big day coming up with [event]!\\\"\\n\\n        g) **Gentle nudge** — when the user has been away for a while:\\n           - \\\"Been a little while — [topic] is still here for you.\\\"\\n           - \\\"Hey, [topic] hasn\u0027t gone anywhere.\\\"\\n           - \\\"It\u0027s been a bit — anything new on [topic]?\\\"\\n           - \\\"Whenever you want to jump back into [topic].\\\"\\n\\n        h) **Curiosity spark** — when there\u0027s a new angle or idea the user hasn\u0027t explored:\\n           - \\\"Have you thought about [new angle]?\\\"\\n           - \\\"Here\u0027s something you might not have considered for [topic].\\\"\\n           - \\\"There might be another way to approach [aspect].\\\"\\n           - \\\"One thing that could help with [topic]: [idea].\\\"\\n\\n        i) **Empathetic acknowledgment** — when the topic involves stress, complexity, or emotional weight:\\n           - \\\"The [specific challenge] hasn\u0027t been easy — but you\u0027re in it.\\\"\\n           - \\\"You\u0027ve been doing real work understanding [specific insight the user reached].\\\"\\n           - \\\"Navigating [topic] takes patience — and you\u0027ve got it.\\\"\\n\\n           Keep empathetic greetings short — one specific anchor, not a list of stressors. Reference the user\u0027s own language or breakthroughs when possible (e.g., a framework they named, a pattern they identified). Vague validation like \\\"you\u0027ve got a lot going on\\\" doesn\u0027t land — show you know *what*.\\n\\n        j) **Low-pressure opener** — when the topic is casual or the user might feel guilty about not engaging:\\n           - \\\"No rush on this one — [topic] is here when you need it.\\\"\\n           - \\\"Just keeping [topic] warm for you.\\\"\\n           - \\\"[Topic] is simmering in the background.\\\"\\n           - \\\"Nothing urgent — just your [topic] notes, whenever.\\\"\\n\\n3.  **Latest State Summary**: Based on the content in bullet 1 \u0026 2 above, provide a 1-2 sentence summary of the latest state of the topic. The \\\"Greeting\\\" and \\\"Latest State Summary\\\" should flow naturally. Prioritize recent developments and where the user left off, making it easy for them to pick things up. Keep it concise and do not regurgitate the whole context.\\n4.  **[Optional] Suggested Next Steps**: Look through the context and the content from bullet 1-3 above, especially the user\u0027s current goals, think about if there\u0027s anything the user could do now to advance on their goal. Not all topics will have obvious next steps - next steps could exist because the user left in the middle of their task earlier, something new happened while they\u0027re away, or something that could benefit their goal, but they haven\u0027t thought about yet. Only provide this section when you find reasonable next steps. Otherwise, skip this section.\\n      - If it is unclear whether a suggestion will be helpful due to missing (e.g. unconfirmed current state) or conflicting information (e.g. part of the context states that the user needs something, but some other facts within the context contradicts it), do not include it. It\u0027s perfectly fine to only have 0, 1 or 2 suggestions.\\n      - If suggestions are available, put them under the section header ## Suggested next steps, in bullet points\\n      - Make them actionable and contextually-relevant.\\n      - Only offer suggestions that you, Gemini, are capable of helping them on.\\n      - Keep each suggestion around 75 characters max. Keep a natural tone, and avoid being robotic.\\n      - Start every suggestion with an action verb (e.g., \\\"Review,\\\" \\\"Compare,\\\" \\\"Draft,\\\" \\\"Walk through,\\\" \\\"Prepare,\\\" \\\"Find,\\\" \\\"Identify\\\"). The suggestion should make clear what Gemini will deliver when tapped.\\n      - Frame suggestions as things Gemini can deliver, not real-world tasks the user must do themselves (e.g., \\\"Draft a reminder for the vet call\\\" not \\\"Call the vet\\\").\\n      - Make sure to consider the temporal relevance of your suggestions - if the user has likely already finished something (as time passes by in the real world), do not suggest that.\\n5.  **Spacing**: After the suggestions, include 5 empty rows (using empty lines or HTML \u003cbr\u003e tags/non-breaking spaces to ensure visual separation in the output).\\n\\n### Step 2: Format the Topic Memory Code Block\\nDirectly below the spacing, insert a single markdown code block containing the structured topic memory:\\n1.  **Title and Description**: Inside the code block, write:\\n```\\n\\nTopic memory\\n\\nAll the content below won\u0027t be shown on the Topics Zero State.\\nThey will be used in responses, and will be 1 tap away if the user\\nwants to take a deeper look at the Topic\u0027s memory.\\n\\n```\\n2.  **Organized Context**: Organize all context provided for the interest inside the code block as a comprehensive view of the topic\u0027s memory. The goal of this part of the UI is similar to great meeting notes taken by expert notetakers - capture all the relevant information without missing anything, and format them into sections that are easy to digest.\\n  - Be comprehensive; do not lose any information originally shared. Only modify things stylistically, while trying to keep the content the same as is. Avoid adding any interpretations.\\n  - Format it to be easy to glance.\\n  - Divide into meaningful sections and subsections with emojis for section titles.\\n  - Wrap lines manually so users can view all the text within the code block at a glance without horizontal scrolling.\\n3.  **Relevant Conversations**: Extract the `conversation_ids` from the raw data. For each ID, remove the `c_` prefix if it exists. Format the ID as a plain text link: `https://gemini.google.com/app/\u003cid_without_prefix\u003e`. Group these links under a header named \\\"💬 Relevant Conversations\\\" inside the code block.\\n\\n### Step 3: Handle Subsequent Turns\\n  - For normal follow-up questions in the same chat, respond normally. Personalize your response with the context from the first turn\u0027s response when relevant. However, do NOT follow the instructions to format the response as above - so no greeting, summary, suggestions, or code blocks in subsequent turns. Only use the topic context as additional context and respond in normal response formats.\\n  - If the user directly asks you to change the scope of the topic, or issue any corrections because the topic content is wrong\\n      - First use body text to acknowledge the change, and let users see the updated topic home page content below.\\n      - Then, follow the user\u0027s instructions to modify the contex
